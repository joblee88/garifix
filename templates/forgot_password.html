{% extends "base.html" %}
{% block title %}Umesahau Password - GariFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-8">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key fa-4x text-primary"></i>
                    <h3 class="fw-bold mt-3">Umesahau Password?</h3>
                    <p class="text-muted">Weka namba yako ya simu uliyotumia kujisajili ili kubadilisha password.</p>
                </div>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Namba ya Simu</label>
                        <input type="tel" name="phone" class="form-control form-control-lg" placeholder="07XXXXXXXX" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fa-solid fa-magnifying-glass me-2"></i> Tafuta Akaunti
                    </button>
                </form>

                <div class="text-center mt-3 mb-2">
                    <a href="{{ url_for('forgot_password_email') }}" class="text-decoration-none">
                        <i class="fa-solid fa-envelope me-1"></i> Tumia Email Badala Yake
                    </a>
                </div>

                <div class="text-center mt-2">
                    <a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left me-1"></i> Rudi kwenye Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
