{% extends "base.html" %}
{% block title %}Login - GariFix Tanzania{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-8">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-car-side fa-4x text-primary"></i>
                    <h3 class="fw-bold mt-3">Karibu GariFix</h3>
                    <p class="text-muted">Ingia kwenye akaunti yako</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Namba ya Simu au Email</label>
                        <input type="text" name="identifier" class="form-control form-control-lg" placeholder="07XXXXXXXX au email@mfano.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
                </form>

                <div class="text-center mb-2">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">
                        <i class="fa-solid fa-key me-1"></i> Umesahau Password?
                    </a>
                </div>

                <hr>
                <div class="text-center">
                    <a href="{{ url_for('customer_register') }}" class="btn btn-outline-success w-100 mb-2">Register as Customer</a>
                    <a href="{{ url_for('mechanic_register') }}" class="btn btn-outline-dark w-100">Register as Mechanic</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
