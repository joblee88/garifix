{% extends "base.html" %}
{% block title %}Login - GariFix Tanzania{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
<div class="auth-page-bg">
<div class="row justify-content-center w-100">
    <div class="col-lg-5 col-md-8">
        <div class="card glass-card p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/garifix-logo-full.png') }}" alt="GariFix" style="width:220px;height:auto;object-fit:contain;">
                    <h3 class="fw-bold mt-3">Karibu GariFix</h3>
                    <p class="text-muted">Ingia kwenye akaunti yako</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Namba ya Simu au Email</label>
                        <input type="text" name="identifier" class="form-control form-control-lg" placeholder="07XXXXXXXX au email@mfano.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group input-group-lg gfx-password-wrapper">
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleGariFixPasswordVisibility(this)">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Nikumbuke (Remember Me)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
                </form>

                {% if google_oauth_enabled %}
                <div class="d-flex align-items-center gap-2 my-3">
                    <hr class="flex-grow-1"><span class="text-muted small">AU</span><hr class="flex-grow-1">
                </div>
                <a href="{{ url_for('google_login', from_app=1) if is_app_mode else url_for('google_login') }}" class="btn btn-outline-secondary btn-lg w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <img src="https://www.google.com/favicon.ico" alt="Google" style="width:20px;height:20px;">
                    Ingia kwa Google
                </a>
                {% endif %}

                <div class="text-center mb-2">
                    <a href="{{ url_for('forgot_password_email') }}" class="text-decoration-none">
                        <i class="fa-solid fa-key me-1"></i> Umesahau Password?
                    </a>
                </div>

                <hr>
                <div class="text-center">
                    <a href="{{ url_for('register_choice') }}" class="btn btn-primary w-100">
                        <i class="fa-solid fa-user-plus me-1"></i> Jisajili Sasa
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
