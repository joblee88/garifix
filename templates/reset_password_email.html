{% extends "base.html" %}
{% block title %}Weka Password Mpya - GariFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-8">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-lock fa-4x text-success"></i>
                    <h3 class="fw-bold mt-3">Weka Password Mpya</h3>
                    <p class="text-muted">Akaunti: <strong>{{ user.full_name }}</strong> ({{ user.email }})</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password Mpya</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Weka password mpya" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Rudia Password Mpya</label>
                        <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="Rudia password mpya" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
                        <i class="fa-solid fa-check me-2"></i> Badilisha Password
                    </button>
                </form>

                <div class="text-center mt-2">
                    <a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left me-1"></i> Rudi kwenye Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
