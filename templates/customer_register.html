{% extends "base.html" %}
{% block title %}Customer Register - GariFix{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='js/phone-input.js') }}"></script>
<script src="{{ url_for('static', filename='js/password-hint.js') }}"></script>
<script src="{{ url_for('static', filename='js/image-compress.js') }}"></script>
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
<div class="auth-page-bg">
<div class="row justify-content-center w-100">
    <div class="col-lg-6 col-md-8">
        <div class="card glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-4x text-primary"></i>
                <h2 class="fw-bold mt-3">Jisajili kama Mteja</h2>
                <p class="text-muted">Fungua akaunti ili uweze kupata huduma za mafundi wa magari.</p>
            </div>

            <form method="POST" action="{{ url_for('customer_register') }}" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="text-center mb-3">
                    <label class="form-label d-block">Picha ya Wasifu (hiari)</label>
                    <input type="file" name="profile_photo" class="form-control" accept="image/*" data-compress data-compress-max="1000" data-compress-quality="0.7">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Jina la Kwanza</label>
                        <input type="text" name="first_name" class="form-control" placeholder="Jina la kwanza" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Jina la Mwisho</label>
                        <input type="text" name="last_name" class="form-control" placeholder="Jina la mwisho" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Namba ya Simu</label>
                    <div class="input-group">
                        <span class="input-group-text fw-bold">+255</span>
                        <input type="tel" inputmode="numeric" class="form-control" maxlength="9" placeholder="712345678" required
                               oninput="syncGariFixPhone(this, 'phoneHidden')">
                    </div>
                    <input type="hidden" name="phone" id="phoneHidden">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group gfx-password-wrapper">
                            <input type="password" id="pwdInput" name="password" class="form-control" placeholder="Weka password" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleGariFixPasswordVisibility(this)"><i class="fa-solid fa-eye"></i></button>
                        </div>
                        <small id="pwdHint" class="form-text text-muted">Angalau herufi 6</small>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Rudia Password</label>
                        <div class="input-group gfx-password-wrapper">
                            <input type="password" name="confirm_password" class="form-control" placeholder="Rudia password" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleGariFixPasswordVisibility(this)"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="agree_terms" id="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                        Nakubaliana na <a href="{{ url_for('terms') }}" target="_blank">Vigezo na Masharti</a> ya GariFix
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fa-solid fa-user-plus me-2"></i> Jisajili
                </button>
            </form>

            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    setupGariFixPasswordHint("pwdInput", "pwdHint");
                });
            </script>

            <div class="text-center mt-4">
                <p>Tayari una akaunti? <a href="{{ url_for('login') }}">Ingia hapa</a></p>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
