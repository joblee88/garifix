{% extends "base.html" %}
{% block title %}Customer Register - GariFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-4x text-primary"></i>
                <h2 class="fw-bold mt-3">Jisajili kama Mteja</h2>
                <p class="text-muted">Fungua akaunti ili uweze kupata huduma za mafundi wa magari.</p>
            </div>

            <form method="POST" action="{{ url_for('customer_register') }}">
                <div class="mb-3">
                    <label class="form-label">Jina Kamili</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Andika jina lako" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Namba ya Simu</label>
                    <input type="text" name="phone" class="form-control" placeholder="07XXXXXXXX" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com">
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Weka password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fa-solid fa-user-plus me-2"></i> Jisajili
                </button>
            </form>

            <div class="text-center mt-4">
                <p>Tayari una akaunti? <a href="{{ url_for('login') }}">Ingia hapa</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
