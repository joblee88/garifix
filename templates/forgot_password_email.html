{% extends "base.html" %}
{% block title %}Reset Password kwa Email - GariFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-8">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-envelope-open-text fa-4x text-primary"></i>
                    <h3 class="fw-bold mt-3">Reset Password kwa Email</h3>
                    <p class="text-muted">Weka email uliyotumia kujisajili - tutakutumia link ya kubadilisha password.</p>
                </div>

                <form method="POST" action="{{ url_for('forgot_password_email') }}">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="email@mfano.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fa-solid fa-paper-plane me-2"></i> Tuma Link ya Reset
                    </button>
                </form>

                <div class="text-center mt-2">
                    <a href="{{ url_for('forgot_password') }}"><i class="fa-solid fa-phone me-1"></i> Tumia Namba ya Simu Badala Yake</a>
                </div>
                <div class="text-center mt-2">
                    <a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left me-1"></i> Rudi kwenye Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
