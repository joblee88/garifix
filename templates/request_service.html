{% extends "base.html" %}
{% block title %}Request Service - GariFix{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-7">
        <div class="card shadow border-0 p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-car-burst fa-4x text-primary"></i>
                <h2 class="fw-bold mt-3">Omba Huduma ya Fundi</h2>
                <p class="text-muted">Eleza tatizo la gari lako ili fundi aweze kukusaidia.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Aina ya Gari / Model</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-car"></i></span>
                        <input type="text" name="vehicle_model" class="form-control" placeholder="Mfano: Toyota FunCargo 2000" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tatizo la Gari</label>
                    <textarea name="problem_description" class="form-control" rows="4" placeholder="Eleza tatizo la gari..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Eneo Ulipo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                        <input type="text" name="location" class="form-control" placeholder="Mfano: Arusha mjini, Sakina" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fa-solid fa-paper-plane me-2"></i> Tuma Ombi
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
