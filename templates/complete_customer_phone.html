{% extends "base.html" %}
{% block title %}Kamilisha Usajili - GariFix{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='js/prevent-double-submit.js') }}"></script>
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-8">
        <div class="card glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-phone-volume fa-4x text-primary mb-3"></i>
                <h3 class="fw-bold">Hatua ya Mwisho!</h3>
                <p class="text-muted">Karibu {{ user.full_name }} - weka namba yako ya simu ili mafundi na GariFix waweze kukufikia.</p>
            </div>

            <form method="POST" id="gfxCompletePhoneForm" onsubmit="return gfxPreventDoubleSubmit(this, 'gfxCompletePhoneBtn');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Namba ya Simu</label>
                    <input type="tel" inputmode="numeric" name="phone" class="form-control form-control-lg" maxlength="10" placeholder="0712345678" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100" id="gfxCompletePhoneBtn">
                    <i class="fa-solid fa-check me-2"></i> Kamilisha Usajili
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
