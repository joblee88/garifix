{% extends "seller_base.html" %}
{% block title %}Taarifa za Duka - GariFix{% endblock %}

{% block seller_content %}
<script src="{{ url_for('static', filename='js/image-compress.js') }}"></script>
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow border-0 p-4">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-store me-2"></i>Taarifa za Duka Lako</h4>

            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">                <div class="mb-3">
                    <label class="form-label fw-semibold">Jina la Duka</label>
                    <input type="text" name="shop_name" class="form-control" value="{{ seller.shop_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Picha ya Duka</label>
                    {% if seller.shop_photo %}
                        <div class="mb-2"><img src="{{ resolve_image_url(seller.shop_photo) }}" style="width:120px;height:120px;object-fit:cover;border-radius:12px;"></div>
                    {% endif %}
                    <input type="file" name="shop_photo" class="form-control" accept="image/*" data-compress data-compress-max="1000" data-compress-quality="0.7">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Unauza Nini?</label>
                    <div class="d-flex gap-4 flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="business_type" value="Spea za Magari" id="editBtParts"
                                {% if seller.business_type and "Spea za Magari" in seller.business_type %}checked{% endif %}>
                            <label class="form-check-label" for="editBtParts">
                                <i class="fa-solid fa-gears me-1"></i> Spea za Magari
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="business_type" value="Mafuta/Lubricants (Oil)" id="editBtOil"
                                {% if seller.business_type and "Mafuta/Lubricants" in seller.business_type %}checked{% endif %}>
                            <label class="form-check-label" for="editBtOil">
                                <i class="fa-solid fa-oil-can me-1"></i> Mafuta ya Magari (Oil/Lubricants)
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Mkoa</label>
                        <input type="text" name="region" class="form-control" value="{{ seller.region }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Wilaya</label>
                        <input type="text" name="district" class="form-control" value="{{ seller.district }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Kata</label>
                        <input type="text" name="ward" class="form-control" value="{{ seller.ward or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Mtaa</label>
                        <input type="text" name="street" class="form-control" value="{{ seller.street or '' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Maelezo ya Duka</label>
                    <textarea name="description" rows="4" class="form-control">{{ seller.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold text-dark">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Hifadhi Mabadiliko
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
