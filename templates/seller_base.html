<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Seller Dashboard - GariFix{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- TOPBAR (fixed, kamwe haifunikwi) -->
<nav class="app-topbar">
    <div class="topbar-left">
        <button class="btn btn-outline-primary menu-toggle-btn d-lg-none" type="button" onclick="toggleGariFixMobileSidebar()" title="Fungua Menyu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <button type="button" class="sidebar-minimize-btn d-none d-lg-flex" onclick="toggleGariFixSidebar()" title="Punguza/Panua Sidebar">
            <i class="fa-solid fa-angles-left"></i>
        </button>
        <span class="topbar-title"><i class="fa-solid fa-shop text-warning"></i> Seller Workspace</span>
    </div>
    <div class="topbar-right">
        <button type="button" class="btn btn-outline-secondary theme-toggle-btn" onclick="toggleGariFixTheme()" title="Badilisha Mandhari (Dark/Light)">
            <i class="theme-toggle-icon fa-solid fa-moon"></i>
        </button>
        <span class="badge bg-warning text-dark fs-6 px-3 py-2 d-none d-sm-inline-flex"><i class="fa fa-store me-1"></i> Verified Seller</span>
    </div>
</nav>

<div class="app-wrapper">
    <!-- BACKDROP (simu pekee) -->
    <div class="sidebar-backdrop" onclick="closeGariFixMobileSidebar()"></div>

    <!-- SIDEBAR (huanzia CHINI ya topbar) -->
    <div class="app-sidebar">
        <nav class="mt-2">
            <a href="{{ url_for('seller_dashboard') }}">
                <i class="fa-solid fa-house"></i> <span class="sidebar-text">Dashboard</span>
            </a>
            <a href="{{ url_for('own_seller_profile') }}">
                <i class="fa-solid fa-store"></i> <span class="sidebar-text">Taarifa za Duka</span>
            </a>
            <a href="{{ url_for('seller_products') }}">
                <i class="fa-solid fa-boxes-stacked"></i> <span class="sidebar-text">Bidhaa Zangu</span>
            </a>
            <hr class="mx-3 text-secondary">
            <a href="{{ url_for('logout') }}" class="text-danger">
                <i class="fa-solid fa-right-from-bracket"></i> <span class="sidebar-text">Logout</span>
            </a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="app-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block seller_content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (window.AndroidApp && typeof window.AndroidApp.getFcmToken === 'function') {
    var _fcmToken = window.AndroidApp.getFcmToken();
    if (_fcmToken) {
        fetch("{{ url_for('register_fcm_token') }}", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "fcm_token=" + encodeURIComponent(_fcmToken)
        });
    }
}
</script>
</body>
</html>
