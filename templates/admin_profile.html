{% extends "admin_base.html" %}
{% block title %}Wasifu Wangu - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow border-0 p-4">
            <h4 class="fw-bold mb-4"><i class="fa-solid fa-user-pen me-2"></i>Wasifu Wangu</h4>

            <div class="text-center mb-4">
                {% if user.profile_photo %}
                    <img src="{{ resolve_image_url(user.profile_photo) }}" class="rounded-circle mb-2" width="100" height="100" style="object-fit:cover;">
                {% else %}
                    <i class="fa-solid fa-circle-user fa-5x text-secondary mb-2"></i>
                {% endif %}
            </div>

            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Picha ya Wasifu</label>
                    <input type="file" name="profile_photo" class="form-control" accept="image/*" data-compress data-compress-max="1000" data-compress-quality="0.7">
                </div>

                <div class="mb-3">
                    <label class="form-label">Jina Kamili</label>
                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username <span class="text-muted small">(hiari - litaonekana kwenye wasifu wako)</span></label>
                    <input type="text" name="username" class="form-control" value="{{ user.username or '' }}" placeholder="mfano: admin_juma" pattern="[a-zA-Z0-9_]+" maxlength="50">
                </div>

                <div class="mb-3">
                    <label class="form-label">Namba ya Simu</label>
                    <input type="text" class="form-control" value="{{ user.phone }}" disabled>
                </div>

                <div class="mb-4">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" value="{{ user.email or '-' }}" disabled>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-floppy-disk me-1"></i> Hifadhi Mabadiliko
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
