{% if is_android_browser and apk_available and not is_app_mode %}
<div id="downloadAppBanner" class="gfx-download-banner">
    <div class="d-flex align-items-center gap-2 p-2">
        <i class="fa-solid fa-car-side text-primary fs-4 flex-shrink-0"></i>
        <div class="flex-grow-1" style="min-width:0;">
            <p class="mb-0 small fw-semibold text-truncate">Pakua App ya GariFix</p>
            <p class="mb-0 text-muted" style="font-size: 11px;">Haraka zaidi + notifications</p>
        </div>
        <a href="{{ url_for('download_app') }}" class="btn btn-primary btn-sm flex-shrink-0">Pakua</a>
        <button type="button" class="btn-close flex-shrink-0" style="font-size:10px;" onclick="document.getElementById('downloadAppBanner').remove(); sessionStorage.setItem('gfxDownloadPopupShown','1');"></button>
    </div>
</div>
<style>
.gfx-download-banner {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 1200;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    animation: gfxSlideUp 0.3s ease;
}
[data-bs-theme="dark"] .gfx-download-banner {
    background: #212529;
}
@keyframes gfxSlideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
    if (sessionStorage.getItem("gfxDownloadPopupShown")) {
        var el = document.getElementById("downloadAppBanner");
        if (el) el.remove();
    } else {
        setTimeout(function () {
            sessionStorage.setItem("gfxDownloadPopupShown", "1");
        }, 500);
    }
});
</script>
{% endif %}
